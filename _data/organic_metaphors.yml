- author: Stef Gjissels
  date: "2011"
  title: "Review of Daniel Levin Quartet <i>Organic Modernism</i>"
  quote: >-
    The music flows organically, growing as it moves along, with instruments coming and going, like birds or bees passing by, coming and going, yet all taking part in the same unpredictable yet not unfamiliar scenery. Despite the apparent freedom, it all sounds very focused and coherent and it was possibly discussed before playing, or maybe not, and these four stellar musicians are just so good and so used to playing together, that this symbiosis of fragile and raw sounds might have been created spontaneously. [...] The music is moving without being sentimental. It has nothing of traditional music, yet it is drenched in familiar sounds that are organised differently, not around structure but around each other, growing organically, with subtle pulse.
  source: https://www.freejazzblog.org/2011/03/nate-wooley.html

- author: Bode Wilson
  date: "2022"
  title: "Liner notes to <i>Aether</i>"
  quote: >-
    Este corpo de três elementos existe e move-se numa simbiose tímbrica e estética que os transforma num elemento só.
  source: https://bodewilson.bandcamp.com/album/aether

- author: Placebo Domingo
  date: "2025"
  title: "Liner notes to <i>First Crash</i>"
  quote: >-
    The band works together on a “wall of sound” and unfolds its music like a single organism.
  source: https://boomslangrecords.bandcamp.com/album/first-crash

- author: Eyal Hareuveni
  date: "2012-10-01"
  title: "Review of Eve Risser / Benjamin Duboc / Edward Perraud <i>En-Corps</i>"
  quote: >-
    It is transformed, patiently and organically, from spare and light articulations into intense, physical sonic crescendos, without ever losing its cohesive power.
  source: https://www.allaboutjazz.com/en-corps-eve-risser-dark-tree-records-review-by-eyal-hareuveni/

- author: Lee Rice Epstein
  date: "2016-11-15"
  title: "Review of Roji <i>The Hundred Headed Women</i>"
  quote: >-
    Throughout writing this review, I found it impossible to avoid organic metaphors.
  source: https://www.freejazzblog.org/2016/11/roji-hundred-headed-women-shhpumaclean.html

- author: Stef Gjissels
  date: "2020-02-14"
  title: "Review of Earth Tongues <i>Atem</i>"
  quote: |
    The result is an almost organic sonic experience. It is the bubbling organic mass that once produced life, the scraping of tectonic plates, the rumbling sounds that create geisers deep under the earth's crust, the sound of wind against rocks, the sound of leaves of grass rubbing against each other, of small creatures in the undergrowth, of deep moaning sounds of other animals, the chirping of ciccadas. No matter. It lives. Complexity emerges from simple things, and it gets a life of its own, something deeply organic. Something out of thin air. The trio create life out of sound.
    
    They manage the listening experience by introducing minor repetitions, things to hold on to, like little sonic strings of DNA, even if the rest of the sounds are unclear and hard to discern and hard to predict. You - as the listener - experience surprise after surprise in this unfamiliar environment. But even if things are strange and unpredictable, they have deep roots in life itself, deeper than music, deeper than feelings, deeper than reason, deeper than evolution, deeper than any form of organisation. It exists. It breathes. It interacts. It creates.
  source: https://www.freejazzblog.org/2020/02/earth-tongues-atem-neither-nor-2019.html

- author: Guido Montegrandi
  date: "2024-01-25"
  title: "Review of Drazer/Fuscaldo/Drake/Aoki/Jones/Abrams <i>June 22</i>"
  quote: All of the pieces in this album are the result of a constant agglomeration and separation of sonic fragments evolving and dying just like living organisms.
  source: https://www.freejazzblog.org/2024/01/drazekfuscaldodrakeaokijonesabrams-june.html

- author: Stef Gjissels
  date: "2014-01-27"
  title: "Review of Abdelhaï Bennani <i>New Today, New Everyday</i>"
  quote: It is primal, open, welcoming notes as they sprout out of the instruments, without force, with being forced, almost without intention, as if by themselves, out of an organic or natural necessity. [...] I cannot say it differently, this is quiet, cautious, intense organic music, full of depth and beauty.
  source: https://www.freejazzblog.org/2014/01/abdelhai-bennani-new-today-new-everyday.html

- author: Paul Acquaro
  date: "2022-03-13"
  title: "Review of Chris Abrahams, Jim Denley and Robbie Avenaim <i>Weft</i>"
  quote: The music flutters ceaselessly like the wind blowing through trees or water cascading through a stream, a trickle of constant, gentle sound. I looked at the barren trees and the nascent buds on some of the bushes. [...] The effect is a blending of organic and non-organic sounds that unfold in a subtle tone-poem.
  source: https://www.freejazzblog.org/2022/03/chris-abrahams-jim-denley-and-robbie.html

- author: S. Victor Aaron
  date: "2014-03-22"
  title: "Review of Ivo Perelman, with Matthew Shipp, William Parker <i>Book of Sound</i>"
  quote: Perelman put the pieces in a certain order after the fact in such a way that it resembles a multi-movement suite, but an array of connected organisms might be a better description. Like real organisms, these songs breathe and goes through stages.
  source: https://somethingelsereviews.com/2014/03/22/ivo-perelman-with-matthew-shipp-william-parker-book-of-sound-2014/

- author: Krzysztof Komorek
  date: "2024-06-07"
  title: "Review of RGG / Pauli Lyytinen / Samuel Blaser <i>City of Gardens, Vol. 2</i>"
  quote: It is a celebration of the individuality of the each of instrumentalists, as well as the unusual fusion of all five into one perfect organism.
  source: https://jazzsuite.wordpress.com/2024/06/07/rgg-pauli-lyytinen-samuel-blaser-city-of-gardens-vol-2/

- author: Andy Hamilton
  date: "2026-03-01"
  title: "Review of Pipeline <i>Ahead Of July</i>"
  quote: Without a score or pre-planned reference points, the group shape an organic whole.
  source: The Wire, issue 505, March 2026, p. 64.

- author: Bill Meyer
  date: "2024-08-01"
  title: "Review of Ivo Perelman & Matthew Shipp <i>Magical Incantation</i>"
  quote: While it’s possible to split the music into Shipp’s stout structural and massively sonic contributions, and Perelman’s flights of exquisitely and ardently voiced expression, that misses the extent to which they become a single organism.
  source: The Wire, issue 486, August 2024, p. 66

- author: Ken Waxman
  date: "2017-07-18"
  title: "Review of Eve Risser / Benjamin Duboc / Edward Perraud <i>En Corps – Generation</i>"
  quote: Unfolding as slowly as a blossom in real time, the pianist’s initial out-of-tempo exposition is quickly deconstructed into brittle key chopping.
  source: https://www.jazzword.com/reviews/eve-risser-benjamin-duboc-edward-perraud-2/

- author: Stephen Crumb
  date: "2017-04-06"
  title: "Interview by Ken Waxman about The Rosetta Trio"
  quote: The synthesis with bass in the middle and stereo guitar lines makes it sound like one organism.
  source: https://www.jazzword.com/reviews/stephan-crump-liberty-ellman-mary-halvorson-ingrid-laubrock/

- author: Ken Waxman
  date: "2017-02-23"
  title: "Liner notes for Joëlle Léandre / Gerald Cleaver / Mat Maneri <i>An Air of Unreality</i>"
  quote: As the strident whistles and sul ponticello lower-pitched tones connect to form a multi-cellular organism, the sections are squeezed into a profound tension-released whole.
  source: https://www.jazzword.com/reviews/joelle-leandre-gerald-cleaver-mat-maneri/

- author: Cisco Bradley
  date: "2019-02-15"
  title: "Concert Review: Lotte Anker / Craig Taborn / Gerald Cleaver at Rehearsal Studios, Dec 19, 2018"
  quote: Rather quickly into this piece, the music felt like one organism, with the different members of the band acting like limbs of that central sonic being, one with three sides, three perspectives, three legs, three arms, moving and contracting, expanding and shifting in multiple directions all at once.
  source: https://www.jazzrightnow.com/review-lotte-anker-craig-taborn-and-gerald-cleaver-at-rehearsal-studios-dec-19-2018/

- author: Cisco Bradley
  date: "2017-07-26"
  title: "Review of Matt Bauder and Day in Pictures <i>Nightshades</i>"
  quote: Nightshades lives and breathes like an organism–emerging, developing evolving, and rising to great heights before receding, transforming listeners in its wake.
  source: https://www.jazzrightnow.com/nightshades-2014-2/

- author: Cisco Bradley
  date: "2017-01-08"
  title: "Concert Review: Geiser at El Quinto Piso (Mexico City), Dec 30, 2017"
  quote: The musical organism gradually coalesced from individual voices and once fused, they remained locked in, all four players bouncing off each other in constant forays, feints, and strikes.
  source: https://www.jazzrightnow.com/review-3-sets-at-el-quinto-piso-mexico-city-dec-30-2017/

- author: Ken Waxman
  date: "2006-07-28"
  title: "Review of Birgit Ulher / Lars Scherzberg / Michael Maierhof <i>Nordzucker</i>"
  quote: It’s almost as if the timbres from all three are arising from one organism.
  source: https://www.jazzword.com/reviews/brigit-ulher-damon-smith-lars-scherzberg-martin-blume-michael-maierhof/

- author: Richard Barrett
  date: "2009"
  title: "Interview by Kevin Patton about the Barrett + Paul Obermayer duo FURT"
  quote: In [the large ensemble] fORCH we tend to function as a single 'organ' within the larger organism.
  source: https://www.pointofdeparture.org/PoD25/PoD25FutureShock.html

- author: Connie Crothers
  date: "2007-09"
  title: "in What's New – The Point of Departure email roundtable moderated by Bill Schoemaker"
  quote: Much of the time, it can be hard to tell who is soloing, the conversation between us flowed so effortlessly. The four of us merged and played as one improvising organism. In this way, through playing together, we found an improvising solution to a band conundrum that many solve through arranging or composition.
  source: http://www.pointofdeparture.org/archives/PoD-13/PoD13WhatsNew.html

- author: Kris Davis
  date: "2017-09-23"
  title: "Liner notes for Kris Davis and Craig Taborn <i>Octopus</i>"
  quote: An occasional response of listeners during the tour was that Craig and I, in performance, were not so much two different musicians as one sort of shape-shifting organism.
  source: https://pyroclasticrecords.com/release/octopus/

- author: Evan Parker
  date: "2010"
  title: "Cover and liner notes to <i>Set</i>"
  quote: |
    [This music] draws inspiration from the SET works of evolutionary biologist Lynn Margulis and is dedicated to her. SET (Serial Endosymbiosis Theory) convincingly explains biological evolution in terms of symbiotic associations of non-cellular organisms – bacteria and such. [...] I hope that the resulting organism that is SET is more than the sum of its parts, and I thank these musicians for their generous creative input which turned my skeletal structures into fully fleshed music.

    <img src="/images/evan-parker-set-cover.jpg" alt="Album cover for Set, by Evan Parker">
  source: https://musicbrainz.org/release/e68c80eb-80cc-4970-b64e-409a976b2231/cover-art

- author: Nou, Això
  date: "2026-04-15"
  title: "Liner notes for Nou, Això (Clara Lai / Joan Torné / Annika Francke) <i>Das Neu</i>"
  quote: Their live performances embrace the principles of improvisation, allowing the music to evolve organically in response to the moment, the space, and the audience.
  source: https://callitanythingrecords.bandcamp.com/album/das-neu

- author: Julian Cowley
  date: "2026-07"
  title: "Review of Tom Raworth & Giancarlo Nino Locatelli <i>A Decent Run</i>"
  quote: Locatelli's group Pipeline functions like a single organism, nurturing the poetic germination of each piece and letting it grow, gracefully or pithily as required.
  source: The Wire, issue 509, July 2026, p. 66

- author: Finn Loxbo
  date: "n.d."
  title: "<i>Kommun</i> bio"
  quote: The ensemble collectively improvises phrases that are formed together as a singular element. The phrases are born together and continue on a cyclic journey, folding into themselves. They are constantly moving but also going nowhere.
  source: https://www.finnloxbo.com/en/artists/cm7evvz8g000hq4jl4ppvx839

- author: Finn Loxbo
  date: "2026-10"
  title: "Interview by Stewart Smith"
  quote: "[about the ensemble Kommun] It's the concept of using the ensemble as one organism, so you improvise phrases together."
  source: The Wire, issue 512, October 2026, p. 19