<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3M6D1JFWN2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      
      gtag('config', 'G-3M6D1JFWN2');
    </script>

    <title>{{ page.title }}</title>
    
    {% if page.description %}
    <meta name="description" content="{{ page.description }}">
    {% endif %}
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script defer src="https://kit.fontawesome.com/d9dbbbf466.js"></script>

    <!-- fonts: Cabinet Grotesk -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,700,800&display=swap" rel="stylesheet">
    
    <!-- link to main stylesheet -->
    <link rel="stylesheet" type="text/css" href="/css/main.css?v=15">

    <!-- rss -->
    <link rel="alternate" type="application/rss+xml" title="News from Nuno Trocado's website" href="/news.xml">

    <!-- favico -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  </head>
  
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="front">
      <header class="site-header">
        {% include titulo.html %}
        {% include menu.html %}
      </header>
      <main id="main-content">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('a').forEach(function(a) {
          var t = a.textContent.trim();
          if (t.startsWith('[') && t.endsWith(']')) {
            a.classList.add('bracket-link');
          }
        });
      });
    </script>
  </body>
</html>
